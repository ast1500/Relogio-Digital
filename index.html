<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd23f">
  <meta name="description" content="Vídeo Limpo: remova GPS, modelo do aparelho, datas e outros metadados dos seus vídeos, direto no navegador.">
  <title>Vídeo Limpo</title>
  <link rel="icon" href="Limpar-Metadados/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="Limpar-Metadados/style.css">
  <style>
    .landing { padding-bottom: 12px; }
    .folder-grid a { color: inherit; text-decoration: none; }
    .home-foot { text-align: center; margin-top: 28px; font-size: 13px; font-weight: 600; color: var(--muted); }
    .home-foot a { color: var(--ink); }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="bg-circle"></span><span class="bg-slab"></span></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="sq-btn tile-yellow" aria-hidden="true">🛡</span>
        <span class="brand-name">Vídeo Limpo</span>
      </div>
      <span class="pill-local">v2.2.0</span>
    </header>
    <section class="landing">
      <h1 class="hero">Seu vídeo.<br>Sem rastros.</h1>
      <div class="drop-row">
        <a class="drop-bar" href="Limpar-Metadados/" style="text-decoration:none;color:inherit">
          <span style="font-weight:900;font-size:20px">#</span>
          <span class="drop-text">Limpar os metadados de um vídeo</span>
        </a>
        <a class="sq-btn big tile-yellow" href="Limpar-Metadados/" aria-label="Abrir o limpador" style="text-decoration:none;color:inherit;font-size:28px">→</a>
      </div>
      <p class="drop-hint">Tudo acontece no seu navegador. Nenhum vídeo é enviado para servidores.</p>

      <h2 class="section-title">Projetos</h2>
      <div class="folder-grid">
        <a class="folder" style="--tab: var(--yellow)" href="Limpar-Metadados/">
          <div class="folder-top"><span class="tile" style="--tile: var(--yellow); font-size:22px">🛡</span>
            <span class="folder-meta">GPS · aparelho<br>datas · software</span></div>
          <h3>Vídeo Limpo</h3>
        </a>
        <a class="folder" style="--tab: var(--purple)" href="Rel%C3%B3gio-Digital/">
          <div class="folder-top"><span class="tile" style="--tile: var(--purple); font-size:22px">◷</span>
            <span class="folder-meta">o projeto original</span></div>
          <h3>Relógio Digital</h3>
        </a>
      </div>
      <p class="home-foot">Código aberto (MIT) · <a href="https://github.com/ast1500/Relogio-Digital">ver no GitHub</a></p>
    </section>
  </div>
</body>
</html>
