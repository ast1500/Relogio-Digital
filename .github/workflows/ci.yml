name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do limpador de metadados
        run: npm test
      - name: Verificar a sintaxe do JavaScript
        run: |
          node --check Limpar-Metadados/app.js
          node --check Limpar-Metadados/metadata.js
          node --check Limpar-Metadados/zip.js
